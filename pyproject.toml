[project]
name = "blueprint-er"
version = "1.0.0"
description = "Blueprint: pseudonymized entity resolution with large language models (code, datasets and run records)."
requires-python = ">=3.9"
dependencies = [
    "openai>=2.0",
    "bm25s",
    "numpy",
    "scikit-learn",
    "langdetect",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
